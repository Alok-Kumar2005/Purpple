[project]
name = "purpple"
version = "0.1.0"
description = "Retail CCTV Store Intelligence Analytics Pipeline - Apex Retail"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.136.3",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "opencv-python-headless>=4.13.0.92",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.2.2",
    "ruff>=0.15.15",
    "sqlalchemy>=2.0.50",
    "streamlit>=1.58.0",
    "supervision>=0.28.0",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
    "ultralytics>=8.4.57",
    "uvicorn[standard]>=0.48.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
pythonpath = [
    ".",         
    "pipeline"   
]
