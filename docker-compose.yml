version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: retail_db
    environment:
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail
      POSTGRES_DB: store_intelligence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail -d store_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: store_intelligence_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://retail:retail@db:5432/store_intelligence
      - ALLOWED_ORIGINS=*
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: